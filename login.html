<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/normalize.css">
    <link rel="preload" href="CSS/normalize.css" as="style">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="preload" href="CSS/style.css" as="style">
    <title>SistemaGyC</title>
</head>
<body>
    <header>
        <div class="logo__Principal">
            <img src="assets/LogoGyC.jpg" alt="Logo G y C Servicio Integral">
        </div>
    </header>

    <main>
        <div>
            <form class="login">
                <fieldset class="login__formulario">
                    <legend class="login__login">Login</legend>
                    <input class="input" type="text" name="usuario" placeholder="Usuario">
                    <input class="input" type="password" name="contrasena" placeholder="contraseña">
                    <button type="submit">Ingresar</button>
                </fieldset>
            </form>
        </div>
    </main>
</body>
</html>
